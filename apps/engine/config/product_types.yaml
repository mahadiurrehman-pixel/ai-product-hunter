# =============================================================================
# REHU Canonical Product Taxonomy
#
# Each product type has:
#   aliases: keywords that map to this type (longer = higher match priority)
#   category: parent category group
#   priority: higher = more specific (wins in conflicts)
#   parent: parent node in taxonomy hierarchy
#   role: product role (device|accessory|replacement_part|consumable|
#         component|bundle|kit|unknown)
#   compatible_categories: for accessories, what device categories they support
#   related_types: semantically related but distinct product types
#
# Adding a new type: add an entry here with aliases, category, priority,
# parent, and role. No Python code changes required.
# =============================================================================

