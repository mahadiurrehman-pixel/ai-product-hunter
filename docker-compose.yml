services:
  postgres:
    image: postgres:15-alpine
    container_name: rehu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: rehu
      POSTGRES_PASSWORD: rehu_pass
      POSTGRES_DB: rehu_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehu -d rehu_db"]
      interval: 5s
      timeout: 3s
      retries: 5

  engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    container_name: rehu-engine-python
    restart: unless-stopped
    ports:
      - "8000:8000"   # Python Engine FastAPI
      - "8501:8501"   # Streamlit UI
      - "8080:8080"   # Compliance endpoint
    volumes:
      - ./apps/engine/data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite:////app/data/product_hunter.db
      - INTERNAL_AUTH_SECRET=${INTERNAL_AUTH_SECRET}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: rehu-api-nestjs
    restart: unless-stopped
    ports:
      - "3000:3000"   # NestJS API
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://rehu:rehu_pass@postgres:5432/rehu_db?schema=public
      - ENGINE_URL=http://engine:8000
    depends_on:
      postgres:
        condition: service_healthy
      engine:
        condition: service_started

volumes:
  pgdata: