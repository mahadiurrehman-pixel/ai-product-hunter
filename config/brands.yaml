# =============================================================================
# Brand database for REHU product normalization
#
# Format:
#   canonical_name:
#     aliases: [lowercase aliases including the canonical name]
#     categories: [product categories this brand is known for]
#
# Adding a new brand:
#   1. Add canonical name as key
#   2. Add all known aliases/misspellings
#   3. Add relevant categories
#
# This file replaces the hardcoded KNOWN_BRANDS set in normalizer.py
# =============================================================================

